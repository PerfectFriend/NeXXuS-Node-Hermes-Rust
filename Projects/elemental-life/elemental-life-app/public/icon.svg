# HOT
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f85149"/>
      <stop offset="100%" stop-color="#f0883e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="air" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="life" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#f0883e"/>
    </linearGradient>
  </defs>
  <!-- Фон -->
  <rect width="512" height="512" fill="url(#bg)" rx="96"/>
  <!-- Внешнее кольцо -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <!-- Стихии по кругу -->
  <!-- Огонь (вверху) -->
  <g transform="translate(256, 96)">
    <polygon points="0,-28 -10,10 10,10" fill="url(#fire)" opacity="0.9"/>
    <polygon points="-4,-18 -14,6 6,6" fill="rgba(248,81,73,0.4)"/>
    <polygon points="4,-18 -6,6 14,6" fill="rgba(240,136,62,0.4)"/>
  </g>
  <!-- Вода (внизу) -->
  <g transform="translate(256, 416)">
    <path d="M-16,8 C-16,-4 -8,-12 0,-20 C8,-12 16,-4 16,8 Z" fill="url(#water)" opacity="0.9"/>
    <path d="M-8,4 C-8,-2 -4,-8 0,-14 C4,-8 8,-2 8,4 Z" fill="rgba(88,166,255,0.3)"/>
  </g>
  <!-- Воздух (слева) -->
  <g transform="translate(96, 256)">
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="none" stroke="url(#air)" stroke-width="3" opacity="0.7"/>
    <ellipse cx="0" cy="-8" rx="14" ry="5" fill="none" stroke="url(#air)" stroke-width="2" opacity="0.5"/>
    <ellipse cx="0" cy="8" rx="14" ry="5" fill="none" stroke="url(#air)" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- Земля (справа) -->
  <g transform="translate(416, 256)">
    <rect x="-14" y="-10" width="28" height="20" rx="2" fill="url(#earth)" opacity="0.85"/>
    <rect x="-10" y="-6" width="6" height="6" rx="1" fill="rgba(63,185,80,0.3)"/>
    <rect x="2" y="-2" width="8" height="4" rx="1" fill="rgba(63,185,80,0.2)"/>
    <rect x="-6" y="6" width="12" height="2" rx="1" fill="rgba(63,185,80,0.15)"/>
  </g>
  <!-- Жизнь (центр) — гексагон -->
  <g transform="translate(256, 256)">
    <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="none" stroke="url(#life)" stroke-width="3" opacity="0.8"/>
    <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="url(#life)" opacity="0.3"/>
    <circle cx="0" cy="0" r="8" fill="url(#life)" opacity="0.9"/>
    <circle cx="0" cy="0" r="3" fill="#fff" opacity="0.6"/>
  </g>
  <!-- Тонкие декоративные линии -->
  <line x1="256" y1="96" x2="256" y2="160" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="256" y1="352" x2="256" y2="416" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="96" y1="256" x2="160" y2="256" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="352" y1="256" x2="416" y2="256" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
</svg>
