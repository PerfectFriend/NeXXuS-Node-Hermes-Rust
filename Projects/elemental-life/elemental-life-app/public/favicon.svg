<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- Гексагон (стихия жизни) -->
  <polygon points="32,8 56,20 56,44 32,56 8,44 8,20"
           fill="none" stroke="#2ecc71" stroke-width="2.5" opacity="0.9"/>
  <!-- Внутренние линии для эффекта сетки -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#2ecc71" stroke-width="1" opacity="0.3"/>
  <line x1="8" y1="20" x2="56" y2="44" stroke="#2ecc71" stroke-width="1" opacity="0.3"/>
  <line x1="8" y1="44" x2="56" y2="20" stroke="#2ecc71" stroke-width="1" opacity="0.3"/>
  <!-- Центральная точка (жизнь) -->
  <circle cx="32" cy="32" r="4" fill="#2ecc71" opacity="0.8"/>
  <!-- Вода (синяя капля) -->
  <circle cx="20" cy="28" r="3" fill="#2196f3" opacity="0.7"/>
  <!-- Огонь -->
  <circle cx="44" cy="28" r="3" fill="#ff5a36" opacity="0.7"/>
  <!-- Земля -->
  <circle cx="32" cy="44" r="3" fill="#8d6e43" opacity="0.7"/>
  <!-- Пар -->
  <circle cx="20" cy="40" r="2" fill="#cfd8e3" opacity="0.5"/>
  <!-- Края гексагона светятся -->
  <polygon points="32,8 56,20 56,44 32,56 8,44 8,20"
           fill="none" stroke="#238636" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
  </polygon>
</svg>
