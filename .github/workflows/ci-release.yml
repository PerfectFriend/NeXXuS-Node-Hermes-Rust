name: NeXXUs CI & Automated Release Builder

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Test & Package NeXXUs Node
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚡ Set up Node.js LTS (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🔍 Lint codebase (TypeScript)
        run: npm run lint

      - name: 🧪 Run Protocol & Golden Vector Test Suites (113 checks)
        run: npm test

      - name: ⚡ Compile Standalone Daemon Bundle (esbuild)
        run: |
          mkdir -p dist
          npx esbuild scripts/linux-daemon.ts --bundle --platform=node --format=cjs --outfile=dist/nexxusd.cjs
          ls -lh dist/nexxusd.cjs

      - name: 📦 Build Debian / Ubuntu amd64 Package (.deb)
        run: |
          bash scripts/build-deb.sh
          ls -lh dist/

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexxus-dist
          path: |
            dist/nexxusd.cjs
            dist/*.deb

  rust:
    name: Rust — test, clippy, build nexxusd
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🦀 Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: 🧪 cargo test --workspace
        run: cargo test --workspace

      - name: 🧹 cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 🔨 cargo build --release -p nexxus-node
        run: cargo build --release -p nexxus-node

      - name: 📤 Upload nexxusd artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexxusd-rust
          path: target/release/nexxusd

  rust-tor:
    name: Rust — build with --features tor (heavy deps)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🦀 Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Cache cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: 🔨 cargo build --release -p nexxus-node --features tor
        run: cargo build --release -p nexxus-node --features tor

  desktop:
    name: Desktop — Rust backend + frontend bundle
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🦀 Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: ⚡ Set up Node.js LTS (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🔨 Build desktop Rust backend
        run: cargo build --release
        working-directory: nexxus-desktop

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🔨 Build frontend bundle
        run: npm run build

      - name: 📤 Upload nexxus-desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexxus-desktop-rust
          path: nexxus-desktop/target/release/nexxus-desktop

  deb:
    name: Debian package (Rust binaries)
    needs: [ rust, desktop ]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 📥 Download nexxusd (Rust) artifact
        uses: actions/download-artifact@v4
        with:
          name: nexxusd-rust
          path: dist

      - name: 📥 Download nexxus-desktop (Rust) artifact
        uses: actions/download-artifact@v4
        with:
          name: nexxus-desktop-rust
          path: dist

      - name: 📦 Build .deb with Rust binaries
        run: bash scripts/build-deb-rust.sh dist/nexxusd dist/nexxus-desktop

      - name: 📤 Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexxus-deb-rust
          path: dist/nexxus_*.deb

  appimage:
    name: AppImage (Linux x86_64)
    needs: [ rust, desktop ]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 📥 Download nexxusd (Rust) artifact
        uses: actions/download-artifact@v4
        with:
          name: nexxusd-rust
          path: dist

      - name: 📥 Download nexxus-desktop (Rust) artifact
        uses: actions/download-artifact@v4
        with:
          name: nexxus-desktop-rust
          path: dist

      - name: 📦 Build AppImage
        run: bash scripts/build-appimage.sh dist/nexxusd dist/nexxus-desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: ✅ Smoke — AppImage распаковывается, nexxusd на месте
        run: |
          chmod +x dist/*.AppImage
          ./dist/*.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/nexxusd
          test -x squashfs-root/usr/bin/nexxus-desktop
          rm -rf squashfs-root

      - name: 📤 Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexxus-appimage
          path: dist/*.AppImage

  release:
    name: Create GitHub Release
    needs: [ build-and-test, rust, rust-tor, desktop, deb, appimage ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nexxus-dist
          path: dist

      - name: 📥 Download nexxusd (Rust) artifact
        uses: actions/download-artifact@v4
        with:
          name: nexxusd-rust
          path: dist

      - name: 📥 Download nexxus-desktop (Rust) artifact
        uses: actions/download-artifact@v4
        with:
          name: nexxus-desktop-rust
          path: dist

      - name: 📥 Download .deb (Rust) artifact
        uses: actions/download-artifact@v4
        with:
          name: nexxus-deb-rust
          path: dist

      - name: 📥 Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: nexxus-appimage
          path: dist

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nexxusd.cjs
            dist/nexxusd
            dist/nexxus-desktop
            dist/*.deb
            dist/*.AppImage
            install.sh
            install.ps1
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
