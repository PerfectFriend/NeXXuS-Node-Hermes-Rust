[package]
name = "nexxus-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nexxusd"
path = "src/main.rs"

[features]
default = []
tor = ["dep:arti-client", "dep:tor-rtcompat"]

[dependencies]
nexxus-core = { workspace = true }
nexxus-econ = { workspace = true }
thiserror = { workspace = true }
redb = { workspace = true }
tokio = { version = "1", features = ["full"] }
rand = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
curve25519-dalek = { workspace = true }
arti-client = { version = "0.47", optional = true, features = ["onion-service-service", "onion-service-client"] }
tor-rtcompat = { version = "0.47", optional = true, features = ["native-tls"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
