[package]
name = "nexxus-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nexxusd"
path = "src/main.rs"

[features]
default = []
tor = ["dep:arti-client"]

[dependencies]
nexxus-core = { workspace = true }
nexxus-econ = { workspace = true }
thiserror = { workspace = true }
redb = { workspace = true }
tokio = { version = "1", features = ["full"] }
rand = { workspace = true }
hex = { workspace = true }
arti-client = { version = "0.47", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
