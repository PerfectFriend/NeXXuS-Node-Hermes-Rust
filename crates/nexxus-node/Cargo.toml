[package]
name = "nexxus-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nexxusd"
path = "src/main.rs"

[features]
default = ["tor"]
tor = [
    "dep:arti-client",
    "dep:tor-rtcompat",
    "dep:tor-hsservice",
    "dep:tor-cell",
    "dep:safelog",
    "dep:tracing-subscriber",
]

[dependencies]
nexxus-core = { workspace = true }
nexxus-econ = { workspace = true }
thiserror = { workspace = true }
redb = { workspace = true }
tokio = { version = "1", features = ["full"] }
rand = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
subtle = "2.6"
rlimit = "0.10"
ed25519-dalek = { workspace = true }
curve25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
arti-client = { version = "0.47", optional = true, features = ["onion-service-service", "onion-service-client", "experimental-api", "keymgr"] }
tor-rtcompat = { version = "0.47", optional = true, features = ["native-tls"] }
tor-hsservice = { version = "0.47", optional = true }
tor-cell = { version = "0.47", optional = true }
safelog = { version = "0.10", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
fs2 = "0.4"
tokio-tungstenite = "0.21"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
