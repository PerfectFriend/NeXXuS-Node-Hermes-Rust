[package]
name = "nexxus-desktop"
version = "1.0.0"
description = "NeXXus Node Monitor — Guardian (ангел-хранитель ноды)"
edition = "2021"

# Отдельный workspace: пакет живёт внутри репо, но не входит в корневой
# workspace crates/* — иначе cargo путается ("believes it's in a workspace").
[workspace]

[dependencies]
# custom-protocol обязателен: без него tauri-build ставит cfg(dev) даже в
# release-сборке, и Tauri грузит страницу с devUrl (http://localhost:1420)
# вместо вшитых ассетов → webview получает "Connection refused" и белый экран.
tauri = { version = "2.0", features = ["tray-icon", "custom-protocol"] }
tauri-build = { version = "2.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = "0.21"
tungstenite = "0.21"
url = "2.5"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
opt-level = "z"

[[bin]]
name = "nexxus-desktop"
path = "src-tauri/main.rs"

[[bin]]
name = "test-api-client"
path = "test_api_client.rs"

[[bin]]
name = "api_probe"
path = "api_probe.rs"
