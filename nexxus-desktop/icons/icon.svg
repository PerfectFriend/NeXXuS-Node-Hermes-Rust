<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Семиугольник (гептагон) -->
  <polygon points="256,40 397,112 455,260 379,400 256,455 133,400 57,260 115,112" 
           fill="url(#grad)" stroke="#003366" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Буква N -->
  <text x="256" y="285" font-family="Arial, sans-serif" font-size="200" font-weight="900" 
        fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="-20">N</text>
</svg>
